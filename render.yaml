# Render Blueprint for the TorqueDoc API.
#
# Free Render services still have an ephemeral filesystem, so production data
# is stored in a free Neon Postgres database instead of /data. Create a Neon
# project (or use the project already linked to this account), copy the pooled
# `DATABASE_URL`, and enter it as a secret in the Render dashboard. Without
# DATABASE_URL the service falls back to SQLite, which is suitable only for
# local development and tests.
services:
  - type: web
    name: torquedoc-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Free Neon Postgres. Use the *pooled* connection string, including
      # `?sslmode=require`, and set it in the Render dashboard (sync: false).
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
      # Generated once by Render. Copy it into app/.env as
      # EXPO_PUBLIC_API_ACCESS_TOKEN before building the app.
      - key: API_ACCESS_TOKEN
        generateValue: true
      # Cloudflare Workers AI Free plan: no credit card, 10,000 Neurons/day,
      # zero retention and no training on submitted content. Keep the account on
      # Workers Free so the daily overage fails instead of billing. Create a free
      # account and an API token with Workers AI access, then set these values in
      # the Render dashboard. Leave them unset to keep AI disabled (503).
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_MODEL
        value: "@cf/mistralai/mistral-small-3.1-24b-instruct"
      - key: CLOUDFLARE_AUDIO_MODEL
        value: "@cf/cloudflare/clef-omni"
      # Optional paid legacy fallback. Leave ANTHROPIC_API_KEY unset for this
      # free deployment; Cloudflare is the supported provider.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      # Media limits. The global Multer ceiling is 100 MB; the media routes
      # enforce a tighter 80 MB video, 20 MB audio and 5 MB photo limit.
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MAX_VIDEO_MB
        value: "80"
      - key: CORS_ORIGIN
        value: "*"
      # Primary browser app used for referral links. Change this if you use a
      # custom domain or a different Vercel project.
      - key: PUBLIC_APP_URL
        value: https://torquedoc-swart.vercel.app
      - key: LOG_REQUESTS
        value: "true"
