# Render Blueprint for the TorqueDoc API.
#
# The free plan is enough to try the app from Expo Go, but its filesystem is
# ephemeral: garage/history records reset when the service redeploys or wakes
# from sleep. For durable data, upgrade the plan and uncomment the disk block
# below (a persistent disk requires a paid instance type).
services:
  - type: web
    name: torquedoc-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/torquedoc.db
      - key: TRUST_PROXY
        value: "true"
      # Generated once by Render. Copy it into app/.env as
      # EXPO_PUBLIC_API_ACCESS_TOKEN before building the app.
      - key: API_ACCESS_TOKEN
        generateValue: true
      # Cloudflare Workers AI free tier: no credit card, 10,000 Neurons/day,
      # zero retention and no training on submitted content. Create a free
      # Cloudflare account and an API token with Workers AI access, then set
      # these two values in the Render dashboard. Leave them unset to keep AI
      # disabled (the routes return a clear 503).
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_MODEL
        value: "@cf/mistralai/mistral-small-3.1-24b-instruct"
      # Optional legacy fallback if you later add Anthropic credits.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_REQUESTS
        value: "true"
    # disk:
