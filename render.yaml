# Render Blueprint for the TorqueDoc API.
#
# The free plan is enough to try the app from Expo Go, but its filesystem is
# ephemeral: garage/history records reset when the service redeploys or wakes
# from sleep. For durable data, upgrade the plan and uncomment the disk block
# below (a persistent disk requires a paid instance type).
services:
  - type: web
    name: torquedoc-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/torquedoc.db
      - key: TRUST_PROXY
        value: "true"
      # Generated once by Render. Copy it into app/.env as
      # EXPO_PUBLIC_API_ACCESS_TOKEN before building the app.
      - key: API_ACCESS_TOKEN
        generateValue: true
      # Set this in the Render dashboard; leave it unset to keep AI disabled.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_REQUESTS
        value: "true"
    # disk:
    #   name: torquedoc-data
    #   mountPath: /data
    #   sizeGB: 1

  # The full Expo app, exported as a static web client. This is the easiest way
  # to try TorqueDoc in a browser without installing the APK. The API token is
  # copied from the API service at Blueprint sync time and baked into the
  # bundle, exactly like the mobile build (it is an abuse gate, not user auth).
  - type: web
    name: torquedoc-web
    runtime: static
    branch: main
    buildCommand: cd app && npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: ./app/dist
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://torquedoc-api.onrender.com
      - key: EXPO_PUBLIC_API_ACCESS_TOKEN
        fromService:
          name: torquedoc-api
          type: web
          envVarKey: API_ACCESS_TOKEN
